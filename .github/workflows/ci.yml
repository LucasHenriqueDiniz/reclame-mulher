name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The pnpm action takes no 'version' input — it reads the packageManager field
# from package.json, which is what keeps CI and local machines on one version.
# The branch here is `master`, not `main`: this repo is served by Vercel, and
# renaming it would mean repointing the project there.

# No build step: Vercel builds and publishes on every push and reports back as a
# commit check. This workflow covers what Vercel does not look at — lint and tests.

jobs:
  check:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test:demo

