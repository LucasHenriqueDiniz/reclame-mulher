name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A action de pnpm não recebe 'version' — ela lê o campo packageManager do
# package.json, que é o que mantém o CI e as máquinas locais na mesma versão.
# A branch aqui é `master`, não `main`: este repo é servido pela Vercel, e
# mudar o nome exigiria reapontar o projeto lá.

# Sem passo de build: a Vercel constrói e publica a cada push, e reporta como
# check no commit. Este workflow cobre o que ela não olha — lint e testes.

jobs:
  check:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Tests
        run: pnpm run test:demo

