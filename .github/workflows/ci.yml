name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The pnpm action takes no 'version' input — it reads the packageManager field
# from package.json, which is what keeps CI and local machines on one version.
# The branch here is `master`, not `main`: this repo is served by Vercel, and
# renaming it would mean repointing the project there.

# No build step: Vercel builds and publishes on every push and reports back as a
# commit check. This workflow covers what Vercel does not look at — lint and tests.

jobs:
  check:
    name: Lint, unit tests & docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test --run

      # The manuals exist twice: the source at the repo root and the served copy under
      # public/. This step fails when they diverge, which they did within hours of the
      # delivery — an edit to the root file after the sync had already run, and no gate
      # noticed because this check was not wired here yet.
      - name: Manuals in sync
        run: pnpm run manuais:check

      # `scripts/demo-tests.ts` is deliberately NOT run here. It has no assertion
      # and no failure path in 87 lines — it prints "24 validações concluídas com
      # sucesso" and exits 0 whatever the code does, so a step calling it reports
      # green on a broken build. It stays in package.json as a checklist for a human
      # demo; it is not a test and CI must not treat it as one.

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # The suite brings up its own throwaway Postgres from docker-compose.e2e.yml
      # and reseeds from nothing on every run, so there is no state to carry between
      # jobs and nothing to clean up. `trust` auth, no password anywhere.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Authentication is programmatic: e2e/global-setup.ts signs one seeded account
      # in through the app's own login endpoint and saves storageState. The password
      # is read from scripts/seed.ts by readSeedPassword() and is never written into
      # a test file, so there is one literal in this repo and CI adds no secret.
      - name: E2E
        run: pnpm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.report/
          retention-days: 7

